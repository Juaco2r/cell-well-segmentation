name: Build Cell Well Segmentation

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: CellWellSegmentation-Windows
            output_name: CellWellSegmentation.exe
          - os: macos-latest
            artifact_name: CellWellSegmentation-macOS
            output_name: CellWellSegmentation-macOS
          - os: ubuntu-latest
            artifact_name: CellWellSegmentation-Linux
            output_name: CellWellSegmentation-Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed ^
            --name CellWellSegmentation ^
            --icon assets/icons/cell_well_segmentation_icon_option1.ico ^
            --add-data "assets;assets" ^
            src/cell_well_segmentation/app.py

      - name: Build macOS executable
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name CellWellSegmentation-macOS \
            --icon assets/icons/cell_well_segmentation_icon_option1.png \
            --add-data "assets:assets" \
            src/cell_well_segmentation/app.py

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name CellWellSegmentation-Linux \
            --icon assets/icons/cell_well_segmentation_icon_option1.png \
            --add-data "assets:assets" \
            src/cell_well_segmentation/app.py

      - name: Rename Windows output
        if: runner.os == 'Windows'
        run: |
          copy dist\CellWellSegmentation.exe dist\${{ matrix.output_name }}

      - name: Rename macOS/Linux output
        if: runner.os != 'Windows'
        run: |
          cp dist/CellWellSegmentation* dist/${{ matrix.output_name }}
          chmod +x dist/${{ matrix.output_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.output_name }}