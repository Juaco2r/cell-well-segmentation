name: Build Cell Well Segmentation

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: CellWellSegmentation-Windows
            output_path: dist/CellWellSegmentation.exe

          - name: macOS
            os: macos-latest
            artifact_name: CellWellSegmentation-macOS
            output_path: dist/CellWellSegmentation-macOS

          - name: Linux
            os: ubuntu-latest
            artifact_name: CellWellSegmentation-Linux
            output_path: dist/CellWellSegmentation-Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed ^
            --name CellWellSegmentation ^
            --icon assets\icons\cell_well_segmentation_icon_option1.ico ^
            --add-data "assets;assets" ^
            src\cell_well_segmentation\app.py

      - name: Build macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name CellWellSegmentation-macOS \
            --icon assets/icons/cell_well_segmentation_icon_option1.png \
            --add-data "assets:assets" \
            src/cell_well_segmentation/app.py

      - name: Build Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name CellWellSegmentation-Linux \
            --icon assets/icons/cell_well_segmentation_icon_option1.png \
            --add-data "assets:assets" \
            src/cell_well_segmentation/app.py

      - name: Make macOS/Linux executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "${{ matrix.output_path }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}