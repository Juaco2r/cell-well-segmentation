[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-well-segmentation"
version = "1.0.0"
description = "GUI for immunofluorescence cell segmentation, quantification, GeoJSON export, and validation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "José J. Rodriguez Rojas"}
]
keywords = ["digital pathology", "immunofluorescence", "cell segmentation", "GeoJSON", "QuPath", "Manders", "DICE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Processing"
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "tifffile>=2024.0",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "scikit-image>=0.22",
  "PyQt5>=5.15",
  "Pillow>=10.0",
  "zarr>=2.16",
  "openslide-python>=1.3"
]

[project.urls]
Homepage = "https://github.com/Juaco2r/cell-well-segmentation"
Repository = "https://github.com/Juaco2r/cell-well-segmentation"
Issues = "https://github.com/Juaco2r/cell-well-segmentation/issues"

[project.scripts]
cell-well-segmentation = "cell_well_segmentation.app:main"

[tool.setuptools.packages.find]
where = ["src"]
